<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{height:100%;margin:0;background:#100f0e;color:#b4b4b4;font:14px -apple-system,Inter,sans-serif;-webkit-app-region:drag}
  .c{height:100%;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center}
  .z{animation:b 1.6s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(255,106,26,.35))}
  .d{width:64px;height:64px;border-radius:50%;background:#ff7a1a;position:relative;animation:b 1.1s ease-in-out infinite}
  .d:before,.d:after{content:'';position:absolute;top:20px;width:10px;height:18px;border-radius:50%;background:#100f0e}
  .d:before{left:18px}.d:after{right:18px}
  @keyframes b{50%{transform:translateY(-4px)}}
  #m{max-width:440px;line-height:1.5}
  code{background:#222;padding:2px 6px;border-radius:5px;color:#eee;-webkit-app-region:no-drag;user-select:text}
</style></head><body><div class="c"><img class="z" src="ziv.png" width="96" height="96"><div id="m">Waking up Ziv…</div></div>
<script>window.setStatus=(t)=>{document.getElementById('m').innerHTML=t}</script></body></html>
